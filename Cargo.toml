[package]
name = "score-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
aws-sdk-s3 = "1.127.0"
axum = { version = "0.8.8", features = ["multipart"] }
base64-simd = "0.8.0"
bcrypt = "0.19.0"
bitflags = "2.11.0"
md5 = "0.8.0"
chrono = { version = "0.4", features = ["default", "serde"] }
deadpool = { version = "0.13", features = ["managed", "rt_tokio_1"] }
discord-webhook2 = "0.4.3"
dotenv = "0.15.0"
iso8601-timestamp = "0.1.11"
redis = { version = "1.0.4", features = ["aio", "tokio-comp"] }
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simple-rijndael = "0.3.2"
sqlx = { version = "0.8.6", features = ["default", "runtime-tokio", "chrono", "rust_decimal", "mysql"] }
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["json"] }
